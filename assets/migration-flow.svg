<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Fargate to Cloud Run: an agent that carries the migration forward</title>
  <desc id="desc">Discover the AWS app, work out the migration, adapt and deploy it, verify real behavior, switch production with approval, and operate the new service. Failed checks return to implementation. Retire AWS only after the rollback window and separate approval.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1728"/><stop offset="1" stop-color="#142E41"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#F5B45D"/><stop offset="1" stop-color="#5CDECD"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8" fill="none" stroke="#79A4B5" stroke-width="1.5"/></marker>
    <style>
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .card{fill:#152A3D;stroke:#345064;stroke-width:1}
      .step{font-size:13px;font-weight:700;letter-spacing:2px;fill:#68DCCD}
      .heading{font-size:25px;font-weight:650;fill:#F3F7FA}
      .body{font-size:17px;fill:#C1D1DB}
      .tag{font-size:12px;font-weight:650;letter-spacing:1px;fill:#92ABBC}
      .link{fill:none;stroke:#79A4B5;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="700" rx="24" fill="url(#bg)"/>
  <rect x="56" y="47" width="34" height="4" rx="2" fill="#F5B45D"/>
  <text x="103" y="54" class="tag" fill="#B9CBD7">FARGATE → CLOUD RUN</text>
  <text x="56" y="112" font-size="43" font-weight="700" fill="#F3F7FA">Bring your app. Keep your momentum.</text>
  <text x="56" y="149" font-size="20" fill="#B8CDDA">The agent handles the cloud work. You decide the tradeoffs.</text>
  <rect x="56" y="178" width="1168" height="2" fill="url(#line)"/>

  <rect x="56" y="210" width="368" height="158" rx="15" class="card"/>
  <text x="80" y="242" class="step">01 / DISCOVER</text>
  <text x="80" y="279" class="heading">Understand the AWS app</text>
  <text x="80" y="309" class="body">Code, containers, configuration,</text>
  <text x="80" y="334" class="body">networking and dependencies.</text>

  <rect x="456" y="210" width="368" height="158" rx="15" class="card"/>
  <text x="480" y="242" class="step">02 / PLAN</text>
  <text x="480" y="279" class="heading">Choose a working path</text>
  <text x="480" y="309" class="body">Resolve gaps. Explain cost, downtime</text>
  <text x="480" y="334" class="body">and what needs to change.</text>

  <rect x="856" y="210" width="368" height="158" rx="15" class="card"/>
  <text x="880" y="242" class="step">03 / IMPLEMENT</text>
  <text x="880" y="279" class="heading">Adapt, build and deploy</text>
  <text x="880" y="309" class="body">Make the changes. Move approved</text>
  <text x="880" y="334" class="body">secrets. Run privately on Google Cloud.</text>

  <path d="M427 289 H450" class="link"/><path d="M827 289 H850" class="link"/>
  <path d="M1040 372 V411" class="link"/>

  <rect x="856" y="420" width="368" height="158" rx="15" class="card"/>
  <text x="880" y="452" class="step">04 / VERIFY</text>
  <text x="880" y="489" class="heading">Test the real application</text>
  <text x="880" y="519" class="body">Critical flows, data access and load.</text>
  <text x="880" y="544" class="body">Fix failures before moving traffic.</text>

  <rect x="456" y="420" width="368" height="158" rx="15" fill="#24303A" stroke="#AE8550"/>
  <text x="480" y="452" class="step" style="fill:#F5C47E">05 / CUT OVER · WITH APPROVAL</text>
  <text x="480" y="489" class="heading">Move production traffic</text>
  <text x="480" y="519" class="body">Execute the reviewed switch.</text>
  <text x="480" y="544" class="body">Watch results. Keep rollback ready.</text>

  <rect x="56" y="420" width="368" height="158" rx="15" class="card"/>
  <text x="80" y="452" class="step">06 / OPERATE</text>
  <text x="80" y="489" class="heading">Leave a usable system</text>
  <text x="80" y="519" class="body">Deployments, monitoring and handoff.</text>
  <text x="80" y="544" class="body">Retire AWS only when approved.</text>

  <path d="M851 499 H831" class="link"/><path d="M451 499 H431" class="link"/>
  <path d="M1228 499 H1251 V289 H1231" fill="none" stroke="#68DCCD" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrow)"/>
  <rect x="56" y="614" width="1168" height="48" rx="12" fill="#0D2030"/>
  <circle cx="81" cy="638" r="4" fill="#68DCCD"/>
  <text x="97" y="644" font-size="16" fill="#C1D1DB">Staging is a checkpoint. A working production app—with verified behavior—is the destination.</text>
</svg>
