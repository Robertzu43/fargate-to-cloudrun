name: docdrift
permissions:
  contents: read
on:
  push:
    paths:
      - "references/rules.json"
      - "scripts/docdrift.py"
      - ".github/workflows/docdrift.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/docdrift.py
