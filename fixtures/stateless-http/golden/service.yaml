apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: "web"  # ecs: service=web
  annotations:
    run.googleapis.com/ingress: "all"  # stated explicitly: Cloud Run's own default lets any resource on the internet reach the service
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"  # ecs: service.desiredCount=2 [scaling.min-instances] ECS desiredCount is a fixed task count; Cloud Run scales on demand, so the count is reported as evidence and minScale defaults to 0. Raise it with --min-instances only to buy away cold starts, and weigh idle cost, concurrency, maximum instances and background CPU before doing so.
    spec:
      serviceAccountName: web-run@my-project.iam.gserviceaccount.com  # created in deploy.sh; the runtime identity
      timeoutSeconds: 300  # Cloud Run documented default [timeout.request] The timeout is set by default to 5 minutes (300 seconds) and can be extended up to 60 minutes (3600 seconds).
      containers:
      - image: "us-docker.pkg.dev/cloudrun/container/hello"  # ecs: containerDefinitions[].image=us-docker.pkg.dev/cloudrun/container/hello [container.image]
        ports:
        - containerPort: 8080  # ecs: portMappings[].containerPort [container.port]
        resources:
          limits:
          # Cloud Run cpu=1 chosen for 0.5 vCPU / 1024 MiB
          # raises the allocation 2x: the task is 0.5 vCPU and this table's smallest tier is 1. Cloud Run also offers sub-vCPU allocations with their own concurrency and feature constraints -- verify current limits against measured utilization before accepting cpu=1
            cpu: "1"  # ecs: cpu=512 memory=1024 [resources.cpu-memory]
            memory: 1024Mi
        env:
        - name: "APP_ENV"
          value: "staging"  # ecs: environment [config.env]
        - name: "LOG_LEVEL"
          value: "info"  # ecs: environment [config.env]
        - name: "DATABASE_URL"
          valueFrom:
            secretKeyRef:
              name: "prod-db-url"
              key: "1"  # pinned Secret Manager version
        startupProbe:
          # Cloud Run probe timing defaults apply (periodSeconds 10, failureThreshold 3, timeoutSeconds 1); the v1 inventory carries no ECS health-check timing
          httpGet:
            path: "/"  # ecs: targetGroups[].healthCheckPath [health.http-probe]
            port: 8080
