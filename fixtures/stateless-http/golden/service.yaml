apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: "web"  # ecs: service=web
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "2"  # ecs: service.desiredCount [scaling.min-instances] Cloud Run scales to zero when idle unless minimum instances are set; the ECS desired count becomes the minimum, and those instances are billed while idle.
    spec:
      serviceAccountName: web-run@my-project.iam.gserviceaccount.com  # created in deploy.sh; the runtime identity
      timeoutSeconds: 300  # Cloud Run documented default [timeout.request] The timeout is set by default to 5 minutes (300 seconds) and can be extended up to 60 minutes (3600 seconds).
      containers:
      - image: "us-docker.pkg.dev/cloudrun/container/hello"  # ecs: containerDefinitions[].image=us-docker.pkg.dev/cloudrun/container/hello [container.image]
        ports:
        - containerPort: 8080  # ecs: portMappings[].containerPort [container.port]
        resources:
          limits:
            cpu: "1"  # ecs: cpu=512 memory=1024 [resources.cpu-memory]
            memory: 1024Mi
        env:
        - name: "APP_ENV"
          value: "staging"  # ecs: environment [config.env]
        - name: "API_KEY"
          value: "<redacted>"  # ecs: environment [config.env]
        - name: "DATABASE_URL"
          valueFrom:
            secretKeyRef:
              name: "prod-db-url"
              key: "1"  # ecs: secrets [secrets.env] pinned to version 1
        startupProbe:
          # Cloud Run probe timing defaults apply (periodSeconds 10, failureThreshold 3, timeoutSeconds 1); the v1 inventory carries no ECS health-check timing
          httpGet:
            path: "/"  # ecs: targetGroups[].healthCheckPath [health.http-probe]
            port: 8080
